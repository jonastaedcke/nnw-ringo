name: Ringo theme issue
description: Report a display or layout problem with Ringo.
title: '[Theme] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Problems that also occur with built-in themes belong in [NetNewsWire's issue tracker](https://github.com/Ranchero-Software/NetNewsWire/issues/new/choose).
  - type: checkboxes
    id: built-in-theme
    attributes:
      label: Scope check
      options:
        - label: The problem does not occur with built-in NetNewsWire themes.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: |
        What happened, and what did you expect? How can it be reproduced?
        Add screenshots or a recording without private details.
      value: |
        When I open the article,

        Steps to reproduce:
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      description: Select all that apply.
      multiple: true
      options:
        - Mac
        - iPhone
        - iPad
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      description: |
        - Mac: Apple menu > About This Mac
        - iPhone and iPad: Settings > General > About
      placeholder: 'macOS 26.0'
    validations:
      required: true
  - type: dropdown
    id: netnewswire-version
    attributes:
      label: NetNewsWire version
      description: |
        Select all that apply.
        - Mac: NetNewsWire > About NetNewsWire
        - iPhone and iPad: bottom of NetNewsWire's settings
      multiple: true
      options:
        - '7.3.1 (Mac)'
        - '7.3 (Mac)'
        - '7.2.1 (Mac)'
        - '7.3 (iPhone, iPad)'
        - '7.2 (iPhone, iPad)'
        - '7.1.3 (iPhone, iPad)'
        - 'Beta (Mac)'
        - 'TestFlight (iPhone, iPad)'
        - 'Older'
    validations:
      required: true
  - type: input
    id: ringo-version
    attributes:
      label: Ringo version
      description: Title of the installed [release](https://github.com/jonastaedcke/nnw-ringo/releases).
      placeholder: '1.1.1'
    validations:
      required: true
  - type: dropdown
    id: appearance
    attributes:
      label: Appearance
      description: Select all that apply.
      multiple: true
      options:
        - Light
        - Dark
    validations:
      required: true
  - type: dropdown
    id: orientation
    attributes:
      label: Orientation
      description: iPhone and iPad only. Select all that apply.
      multiple: true
      options:
        - Portrait
        - Landscape
  - type: input
    id: layout
    attributes:
      label: Window mode
      placeholder: 'iPad Split View'
  - type: input
    id: text-size
    attributes:
      label: Text size
      description: NetNewsWire text size on the Mac, Dynamic Type on iPhone and iPad.
      placeholder: 'Default, two steps larger'
  - type: input
    id: article-url
    attributes:
      label: Article URL
  - type: markdown
    attributes:
      value: Thank you for taking the time to write this report.
