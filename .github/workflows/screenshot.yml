# nnw-theme-stub: screenshot v2
name: Refresh marketplace screenshot

on:
  workflow_dispatch:
    inputs:
      fixture:
        description: Fixture to capture
        type: choice
        options: [article, kitchen-sink]
        default: article
      appearance:
        description: Appearance to capture
        type: choice
        options: [light, dark]
        default: light

permissions:
  contents: write
  pull-requests: write

jobs:
  screenshot:
    uses: dave-atx/nnw-theme/.github/workflows/theme-screenshot.yml@ff26b8e7900138e5ca83e207aad809f4674e20f1 # v2
    with:
      fixture: ${{ inputs.fixture }}
      appearance: ${{ inputs.appearance }}
